services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/sprint_retro.db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    env_file:
      - .env
    ports:
      - "3004:3000"
    depends_on:
      - backend
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${LANDING_PORT:-3005}:3001"
    restart: unless-stopped
